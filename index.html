<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Points de Félix</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Défi de fin d'année</p>
          <h1 id="page-title">Points de Félix</h1>
          <p class="hero-text">Un point perdu par retard ou message de l'école.</p>
        </div>

        <div class="points-display" aria-label="Points restants">
          <div class="points-ring" id="points-ring">
            <div class="points-core">
              <span>Il reste</span>
              <strong id="points-left">20</strong>
              <small>points</small>
            </div>
          </div>
        </div>
      </section>

      <div class="reward" id="reward-status" aria-live="polite"></div>

      <section class="score-grid" aria-label="Résumé des points">
        <article class="score-card">
          <span>Points de départ</span>
          <strong>20</strong>
        </article>
        <article class="score-card">
          <span>Périodes restantes</span>
          <strong>68</strong>
        </article>
        <article class="score-card">
          <span>Points perdus</span>
          <strong id="loss-count">0</strong>
        </article>
      </section>

      <div class="meter-card" aria-hidden="true">
        <div class="meter-labels">
          <span>Progression</span>
          <span id="meter-percent">100%</span>
        </div>
        <div class="meter">
          <div id="points-meter"></div>
        </div>
      </div>

      <section class="workspace read-only">
        <section class="panel history-panel" aria-labelledby="history-title">
          <div class="panel-header compact">
            <div>
              <h2 id="history-title">Historique</h2>
              <p id="history-empty">Aucune perte de point pour le moment.</p>
            </div>
            <p class="updated-at" id="updated-at"></p>
          </div>
          <ol class="history-list" id="history-list"></ol>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
